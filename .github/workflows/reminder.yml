name: Monthly Reminder

on:
  workflow_dispatch: # Ermöglicht das manuelle Starten des Workflows
  schedule:
    - cron: "0 9 1 * *" # Erinnerung jeden Monat am 1. um 9:00 Uhr UTC

jobs:
  reminder:
    runs-on: ubuntu-latest
    steps:
      - name: Send Reminder
        uses: dawidd6/action-send-mail@v3
        with:
          from: ${{ secrets.EMAIL_USERNAME }} # Absender ist die hinterlegte E-Mail
          server_address: smtp.gmail.com
          server_port: 587
          username: ${{ secrets.EMAIL_USERNAME }} # Benutzername aus Secrets
          password: ${{ secrets.EMAIL_PASSWORD }} # Passwort aus Secrets
          subject: "Monatliche Erinnerung: Ziele überprüfen"
          body: |
            Hallo Claudiu,

            erinnere dich daran, deinen Fortschritt im 6-Monats-Plan zu überprüfen:
            - Weiterbildung
            - Netzwerken
            - Projektakquise

            Liebe Grüße, deine GitHub Actions
          to: ${{ secrets.EMAIL_USERNAME }} # Empfänger ist ebenfalls die hinterlegte E-Mail
